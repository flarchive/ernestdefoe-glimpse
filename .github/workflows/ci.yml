# What the shared Flarum workflows (backend.yml, frontend.yml) don't check:
# that composer.json is valid, that every translation key exists and is used,
# the unit tests, and that the committed JS bundle — what forums actually load,
# never rebuilt on install — matches a fresh build of js/src (and type-checks).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer:
    name: composer.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

  locale-and-unit:
    name: Locale keys and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install
        run: composer install --no-interaction --no-progress

      # Every key the code uses exists in locale/en.yml, and every key there is used.
      - name: Locale keys
        run: php tests/locale-check.php

      - name: Unit tests
        run: composer test:unit

  js:
    name: JS bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install
        working-directory: js
        run: npm ci

      - name: Prettier
        working-directory: js
        run: npm run format-check

      - name: Types
        working-directory: js
        run: npm run check-typings

      - name: Build
        working-directory: js
        run: npm run build

      # js/dist is committed and is what forums load. If a build from the
      # committed source produces different bytes, the shipped bundle is not
      # the shipped source — which is invisible until someone debugs the wrong
      # code.
      - name: Fail if the committed bundle is stale
        run: |
          if ! git diff --quiet -- js/dist; then
            echo "js/dist differs from a fresh build of js/src — run 'npm run build' in js/ and commit." >&2
            git diff --stat -- js/dist
            exit 1
          fi
